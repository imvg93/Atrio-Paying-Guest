spring:
  application:
    name: atrio-pg-api

  # Reuse the existing NestJS .env rather than duplicating credentials.
  # Both imports are optional, so real environment variables (CI, prod) win
  # and nothing breaks when the file is absent.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../backend/.env[.properties]

  profiles:
    default: local

  datasource:
    # DB_SSL=true in .env corresponds to sslmode=require here.
    #
    # stringtype=unspecified is required, not cosmetic: enum columns are
    # Postgres named enum types, and the JPA converters bind their labels as
    # String. Postgres will not implicitly cast varchar to an enum, so the
    # driver must send the value untyped and let the server infer it.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}&stringtype=unspecified
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      pool-name: atrio-pool

  jpa:
    # CLAUDE.md 3.4 - schema changes are versioned migrations only.
    # `validate` verifies entities match the existing tables and fails fast on
    # drift. Never `update`, never `create`.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The Supabase schema already exists (built by TypeORM). baseline-on-migrate
    # writes a BASELINE row at v1 and SKIPS V1 there, so no table is recreated.
    # On an empty database (Testcontainers) baseline does not apply and V1 runs
    # normally. See MIGRATION_PLAN.md 3.2.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing schema created by TypeORM migrations
    validate-on-migrate: true
    # `flyway clean` against Supabase would be catastrophic.
    clean-disabled: true

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Mirrors the NestJS ValidationPipe `forbidNonWhitelisted: true`.
      # Spring Boot disables this by default, so it must be set explicitly.
      fail-on-unknown-properties: true

# Auth policy, read from the same env var names the NestJS backend used so
# deployment config is unchanged (MIGRATION_PLAN.md 6.4). Bean Validation on
# AuthProperties replaces the old Joi schema and still fails the boot.
atrio:
  auth:
    jwt:
      # Used as raw UTF-8 bytes, never base64-decoded - that is what
      # @nestjs/jwt would have done, and it is permanent once tokens exist.
      access-secret: ${JWT_ACCESS_SECRET}
      access-ttl: ${JWT_ACCESS_TTL:15m}
      # Not a signing key: refresh tokens are opaque random values, and this
      # peppers the HMAC-SHA256 digest stored in refresh_tokens.token_hash.
      refresh-secret: ${JWT_REFRESH_SECRET}
      refresh-ttl: ${JWT_REFRESH_TTL:30d}
    otp:
      ttl: ${OTP_TTL_SECONDS:300}s
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      request-limit: ${OTP_REQUEST_LIMIT:3}
      request-window: ${OTP_REQUEST_WINDOW_SECONDS:600}s
      code-length: 6

server:
  # NestJS holds 3000 until parity is proven; run alongside it, not over it.
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

# Actuator stays at the root (no /api/v1 prefix) for platform health checks.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.atrio.pg: INFO
