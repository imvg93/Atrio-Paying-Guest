spring:
  # In production every value comes from real environment variables; never
  # from a .env file on disk.
  config:
    import: []

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}

  jpa:
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.atrio.pg: INFO
